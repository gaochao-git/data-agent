# Ruff 配置（后端 lint 门禁）
#
# 门禁脚本：scripts/checks/ruff.py；本地统一入口：scripts/verify（步骤名 ruff）。
# 说明：server/ 下没有 pyproject.toml，故用 ruff 官方支持的独立配置文件 ruff.toml。
#
# 规则取舍：只开「bug 级」三类，风格/现代化类（E501 行长、UP006/UP045 注解现代化、
# I001 import 排序等）存量数千条且纯风格，一次性改等于全库大重构，暂不纳入门禁。

line-length = 120
target-version = "py312"
src = ["server"]

[lint]
# F   = pyflakes：未使用 import/变量、重定义等真实错误
# B   = flake8-bugbear：常见坑——可变默认入参、异常链丢失、zip 无 strict 等
# SIM = flake8-simplify：冗余分支与啰嗦写法
select = ["F", "B", "SIM"]

[lint.per-file-ignores]
# FastAPI 依赖注入的惯用写法就是 `file: UploadFile = File(...)`，此处调函数是必须的，
# B008 属误报（Octop 也对 api/** 忽略 B008）。注意 services/ 下出现的 B008 是真问题，不放宽。
"server/apps/chat_data_app/routers/**" = ["B008"]
