---
- name: Manage resource pressure scripts
  hosts: all
  gather_facts: no
  vars:
    cpu_script_path: "{{ remote_base }}/cpu_pressure.sh"
    memory_script_path: "{{ remote_base }}/memory_pressure.sh"
    disk_script_path: "{{ remote_base }}/disk_pressure.sh"

  tasks:
    - name: Validate action
      fail:
        msg: "action must be one of: start, stop, status, cleanup-disk"
      when: action not in ['start', 'stop', 'status', 'cleanup-disk']

    - name: Ensure remote directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      with_items:
        - "{{ remote_base }}"
        - "{{ remote_log_dir }}"
        - "{{ remote_disk_target }}"
      when: action == 'start'

    - name: Sync pressure scripts
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0755"
      with_items:
        - { src: "{{ playbook_dir }}/cpu_pressure.sh", dest: "{{ cpu_script_path }}" }
        - { src: "{{ playbook_dir }}/memory_pressure.sh", dest: "{{ memory_script_path }}" }
        - { src: "{{ playbook_dir }}/disk_pressure.sh", dest: "{{ disk_script_path }}" }
      when: action == 'start'

    - name: Stop cpu pressure process
      shell: |
        set -e
        find_script_pids() {
          ps -eo pid=,args= | awk -v needle="{{ cpu_script_path }}" 'index($0, needle) && index($0, "awk -v needle") == 0 { print $1 }'
        }
        pids="$(find_script_pids || true)"
        if [ -n "${pids}" ]; then
          for pid in ${pids}; do kill "${pid}" 2>/dev/null || true; done
          sleep 1
          remain="$(find_script_pids || true)"
          if [ -n "${remain}" ]; then
            for pid in ${remain}; do kill -9 "${pid}" 2>/dev/null || true; done
          fi
        fi
        if [ -d "{{ remote_cpu_state_root }}" ]; then
          find "{{ remote_cpu_state_root }}" -type f -name '*.pid' | while read -r pid_file; do
            worker_pid="$(cat "${pid_file}" 2>/dev/null || true)"
            [ -n "${worker_pid}" ] && kill "${worker_pid}" 2>/dev/null || true
            [ -n "${worker_pid}" ] && kill -9 "${worker_pid}" 2>/dev/null || true
          done
          rm -rf "{{ remote_cpu_state_root }}" || true
        fi
      args:
        executable: /bin/bash
      when: action == 'stop'

    - name: Stop memory pressure process
      shell: |
        set -e
        find_script_pids() {
          ps -eo pid=,args= | awk -v needle="{{ memory_script_path }}" 'index($0, needle) && index($0, "awk -v needle") == 0 { print $1 }'
        }
        pids="$(find_script_pids || true)"
        if [ -n "${pids}" ]; then
          for pid in ${pids}; do kill "${pid}" 2>/dev/null || true; done
          sleep 1
          remain="$(find_script_pids || true)"
          if [ -n "${remain}" ]; then
            for pid in ${remain}; do kill -9 "${pid}" 2>/dev/null || true; done
          fi
        fi
        rm -f "{{ remote_memory_state_dir }}"/mem-pressure-*.bin || true
      args:
        executable: /bin/bash
      when: action == 'stop'

    - name: Stop disk pressure process
      shell: |
        set -e
        find_script_pids() {
          ps -eo pid=,args= | awk -v needle="{{ disk_script_path }}" 'index($0, needle) && index($0, "awk -v needle") == 0 { print $1 }'
        }
        pids="$(find_script_pids || true)"
        if [ -n "${pids}" ]; then
          for pid in ${pids}; do kill "${pid}" 2>/dev/null || true; done
          sleep 1
          remain="$(find_script_pids || true)"
          if [ -n "${remain}" ]; then
            for pid in ${remain}; do kill -9 "${pid}" 2>/dev/null || true; done
          fi
        fi
      args:
        executable: /bin/bash
      when: action == 'stop'

    - name: Start cpu pressure process
      shell: |
        set -e
        find_script_pids() {
          ps -eo pid=,args= | awk -v needle="{{ cpu_script_path }}" 'index($0, needle) && index($0, "awk -v needle") == 0 { print $1 }'
        }
        if [ -z "$(find_script_pids || true)" ]; then
          setsid -f bash -lc "nohup env MIN_PERCENT='{{ min_percent }}' MAX_PERCENT='{{ max_percent }}' CHECK_INTERVAL='{{ check_interval }}' CPU_GAIN='{{ cpu_gain }}' MAX_WORKERS='{{ max_workers }}' bash '{{ cpu_script_path }}' >> '{{ remote_log_dir }}/cpu_pressure.log' 2>&1 </dev/null"
          sleep 1
        fi
        find_script_pids || true
      args:
        executable: /bin/bash
      register: cpu_start_result
      changed_when: false
      when: action == 'start'

    - name: Start memory pressure process
      shell: |
        set -e
        find_script_pids() {
          ps -eo pid=,args= | awk -v needle="{{ memory_script_path }}" 'index($0, needle) && index($0, "awk -v needle") == 0 { print $1 }'
        }
        if [ -z "$(find_script_pids || true)" ]; then
          setsid -f bash -lc "nohup env MIN_PERCENT='{{ min_percent }}' MAX_PERCENT='{{ max_percent }}' CHECK_INTERVAL='{{ check_interval }}' bash '{{ memory_script_path }}' >> '{{ remote_log_dir }}/memory_pressure.log' 2>&1 </dev/null"
          sleep 1
        fi
        find_script_pids || true
      args:
        executable: /bin/bash
      register: memory_start_result
      changed_when: false
      when: action == 'start'

    - name: Start disk pressure process
      shell: |
        set -e
        find_script_pids() {
          ps -eo pid=,args= | awk -v needle="{{ disk_script_path }}" 'index($0, needle) && index($0, "awk -v needle") == 0 { print $1 }'
        }
        if [ -z "$(find_script_pids || true)" ]; then
          setsid -f bash -lc "nohup env MIN_PERCENT='{{ min_percent }}' MAX_PERCENT='{{ max_percent }}' CHUNK_MB='{{ chunk_mb }}' TARGET_PATH='{{ remote_disk_target }}' bash '{{ disk_script_path }}' >> '{{ remote_log_dir }}/disk_pressure.log' 2>&1 </dev/null"
          sleep 1
        fi
        find_script_pids || true
      args:
        executable: /bin/bash
      register: disk_start_result
      changed_when: false
      when: action == 'start'

    - name: Cleanup disk pressure files
      shell: |
        set -e
        TARGET_PATH='{{ remote_disk_target }}' bash '{{ disk_script_path }}' --cleanup
      args:
        executable: /bin/bash
      when: action == 'cleanup-disk'

    - name: Collect status snapshot
      shell: |
        set -e
        find_script_pids() {
          local script_path="$1"
          ps -eo pid=,args= | awk -v needle="${script_path}" 'index($0, needle) && index($0, "awk -v needle") == 0 { print $1 }'
        }
        read_cpu_percent() {
          read -r _ user nice system idle iowait irq softirq steal _ < /proc/stat
          total1=$((user + nice + system + idle + iowait + irq + softirq + steal))
          idle1=$((idle + iowait))
          sleep 1
          read -r _ user nice system idle iowait irq softirq steal _ < /proc/stat
          total2=$((user + nice + system + idle + iowait + irq + softirq + steal))
          idle2=$((idle + iowait))
          awk -v total1="${total1}" -v total2="${total2}" -v idle1="${idle1}" -v idle2="${idle2}" 'BEGIN {
            total = total2 - total1
            idle = idle2 - idle1
            if (total <= 0) { print "N/A"; exit }
            used = (1 - idle / total) * 100
            if (used < 0) used = 0
            printf "%.2f", used
          }'
        }
        read_mem_percent() {
          awk '
            /^MemTotal:/ { total = $2 * 1024 }
            /^MemAvailable:/ { available = $2 * 1024 }
            END {
              if (total <= 0) { print "N/A"; exit }
              used = total - available
              if (used < 0) used = 0
              printf "%.2f", used * 100 / total
            }
          ' /proc/meminfo
        }
        read_disk_percent() {
          probe="{{ remote_disk_target }}"
          if [ ! -e "${probe}" ]; then
            probe="$(dirname "${probe}")"
          fi
          df -P "${probe}" 2>/dev/null | awk 'NR==2 { gsub(/%/, "", $5); print $5 }'
        }
        echo "cpu_pid=$(find_script_pids '{{ cpu_script_path }}' | tr '\n' ' ')"
        echo "memory_pid=$(find_script_pids '{{ memory_script_path }}' | tr '\n' ' ')"
        echo "disk_pid=$(find_script_pids '{{ disk_script_path }}' | tr '\n' ' ')"
        echo "cpu_percent=$(read_cpu_percent)"
        echo "memory_percent=$(read_mem_percent)"
        echo "disk_percent=$(read_disk_percent)"
      args:
        executable: /bin/bash
      register: status_snapshot
      changed_when: false
      when: action == 'status'

    - name: Show status snapshot
      debug:
        msg: "{{ inventory_hostname }} | {{ item }}"
      with_items: "{{ status_snapshot.stdout_lines | default([]) }}"
      when: action == 'status'
