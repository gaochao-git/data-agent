---
- name: Deploy expert-api
  hosts: all
  become: true
  gather_facts: false

  vars:
    pkg_name: expert-api-0410.tar.gz
    remote_pkg: /tools/apps/expert-api-0410.tar.gz
    pkg_upload_dir: /tools/apps
    app_root: /tools/apps
    app_dir: /tools/apps/expert-api
    run_user: ""
    expert_log_file: /data/expert-api.lout

  tasks:
    - name: Resolve deploy group
      set_fact:
        deploy_group: "{{ (group_names | intersect(['bj12', 'sh20', 'sz32']) | first) | default('') }}"

    - name: Fail when deploy group missing
      fail:
        msg: "host is not in bj12/sh20/sz32 group"
      when: deploy_group == ''

    - name: Fail when run_user missing
      fail:
        msg: "run_user is required, example: -e run_user=nuxx"
      when: run_user | trim == ""

    - name: Ensure upload dir exists
      file:
        path: "{{ pkg_upload_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure app root exists
      file:
        path: "{{ app_root }}"
        state: directory
        mode: "0755"

    - name: Upload package
      copy:
        src: "{{ pkg_name }}"
        dest: "{{ remote_pkg }}"
        mode: "0644"

    - name: Stop old expert-api
      shell: "./stop.sh || true"
      args:
        chdir: "{{ app_dir }}"
        executable: /bin/bash
      ignore_errors: true

    - name: Remove old expert-api dir
      file:
        path: "{{ app_dir }}"
        state: absent

    - name: Extract package
      unarchive:
        src: "{{ remote_pkg }}"
        dest: "{{ app_root }}"
        remote_src: true

    - name: Ensure expert-api log file exists
      file:
        path: "{{ expert_log_file }}"
        state: touch
        mode: "0644"

    - name: Set ownership for expert-api dir
      file:
        path: "{{ app_dir }}"
        state: directory
        recurse: true
        owner: "{{ run_user }}"
        group: "{{ run_user }}"

    - name: Set ownership for expert-api log file
      file:
        path: "{{ expert_log_file }}"
        owner: "{{ run_user }}"
        group: "{{ run_user }}"
        mode: "0644"

    - name: Start expert-api
      become_user: "{{ run_user }}"
      shell: "nohup ./start.sh {{ deploy_group }} >> {{ expert_log_file }} 2>&1 </dev/null &"
      args:
        chdir: "{{ app_dir }}"
        executable: /bin/bash

    - name: Wait for 8001 port
      shell: "ss -lntp | grep ':8001 '"
      args:
        executable: /bin/bash
      register: port_check
      retries: 10
      delay: 2
      until: port_check.rc == 0
      changed_when: false

    - name: Check expert-api process
      shell: "ps -ef | grep -E 'expert-api|start.sh' | grep -v grep"
      register: expert_ps
      changed_when: false

    - name: Show expert-api process
      debug:
        var: expert_ps.stdout_lines
