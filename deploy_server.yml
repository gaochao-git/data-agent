---
- name: Deploy fxcjg server
  hosts: all
  become: true
  gather_facts: false

  vars:
    pkg_name: server0411.tar.gz
    remote_pkg: /tmp/server0411.tar.gz
    app_root: /tools/apps
    server_dir: /tools/apps/server
    python312_bin: /usr/local/python312/bin/python3.12
    run_user: ""
    server_log_file: /data/server.lout

  tasks:
    - name: Resolve deploy group
      set_fact:
        deploy_group: "{{ (group_names | intersect(['bj12', 'sh20', 'sz32']) | first) | default('') }}"

    - name: Fail when deploy group missing
      fail:
        msg: "host is not in bj12/sh20/sz32 group"
      when: deploy_group == ''

    - name: Ensure app root exists
      file:
        path: "{{ app_root }}"
        state: directory
        mode: "0755"

    - name: Upload package
      copy:
        src: "{{ pkg_name }}"
        dest: "{{ remote_pkg }}"
        mode: "0644"

    - name: Fail when run_user missing
      fail:
        msg: "run_user is required, example: -e run_user=nuxx"
      when: run_user | trim == ""

    - name: Stop old server process
      shell: |
        pids=$(ss -lntp 2>/dev/null | awk -F 'pid=' '/:5001 / {split($2,a,","); print a[1]}' | sort -u)
        if [ -z "$pids" ]; then
          pids=$(ps -ef | awk '/\.venv\/bin\/python3\.12/ && /main\.py/ && !/awk/ {print $2}')
        fi
        if [ -n "$pids" ]; then
          kill $pids || true
          sleep 2
          kill -9 $pids || true
        fi
      args:
        executable: /bin/bash

    - name: Remove old server dir
      file:
        path: "{{ server_dir }}"
        state: absent

    - name: Extract package
      unarchive:
        src: "{{ remote_pkg }}"
        dest: "{{ app_root }}"
        remote_src: true

    - name: Fix venv python3.12 symlink
      file:
        src: "{{ python312_bin }}"
        dest: "{{ server_dir }}/.venv/bin/python3.12"
        state: link
        force: true

    - name: Set env file by deploy group
      copy:
        src: "{{ server_dir }}/.env.psoss-{{ deploy_group }}"
        dest: "{{ server_dir }}/.env"
        remote_src: true
        mode: "0644"

    - name: Ensure server log file exists
      file:
        path: "{{ server_log_file }}"
        state: touch
        mode: "0644"

    - name: Set ownership for server dir
      file:
        path: "{{ server_dir }}"
        state: directory
        recurse: true
        owner: "{{ run_user }}"
        group: "{{ run_user }}"

    - name: Set ownership for server log file
      file:
        path: "{{ server_log_file }}"
        owner: "{{ run_user }}"
        group: "{{ run_user }}"
        mode: "0644"

    - name: Start server
      become_user: "{{ run_user }}"
      shell: "nohup ./.venv/bin/python3.12 -u main.py >> {{ server_log_file }} 2>&1 </dev/null &"
      args:
        chdir: "{{ server_dir }}"
        executable: /bin/bash

    - name: Wait for 5001 port
      shell: "ss -lntp | grep ':5001 '"
      args:
        executable: /bin/bash
      register: port_check
      retries: 10
      delay: 2
      until: port_check.rc == 0
      changed_when: false

    - name: Check server process
      shell: "ps -ef | grep -E 'main.py|server.lout' | grep -v grep"
      register: server_ps
      changed_when: false

    - name: Show server process
      debug:
        var: server_ps.stdout_lines
