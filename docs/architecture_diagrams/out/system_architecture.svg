<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="860" viewBox="0 0 1520 860">
<style>
    .title { font: 700 28px PingFang SC, Microsoft YaHei, Arial, sans-serif; fill: #152033; }
    .subtitle { font: 600 18px PingFang SC, Microsoft YaHei, Arial, sans-serif; fill: #355070; }
    .label { font: 500 16px PingFang SC, Microsoft YaHei, Arial, sans-serif; fill: #203040; }
    .small { font: 400 13px PingFang SC, Microsoft YaHei, Arial, sans-serif; fill: #526072; }
    .box { fill: #ffffff; stroke: #355070; stroke-width: 2; rx: 16; ry: 16; }
    .zone-dmz { fill: #f7fbff; stroke: #5b8def; stroke-width: 2.5; rx: 22; ry: 22; }
    .zone-app { fill: #f5fcf8; stroke: #3aa675; stroke-width: 2.5; rx: 22; ry: 22; }
    .zone-local { fill: #fffaf0; stroke: #e6a23c; stroke-width: 2.5; rx: 22; ry: 22; }
    .zone-uat { fill: #f7fbff; stroke: #5b8def; stroke-width: 2.5; rx: 22; ry: 22; }
    .zone-prod { fill: #f5fcf8; stroke: #3aa675; stroke-width: 2.5; rx: 22; ry: 22; }
    .arrow { stroke: #4a5568; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .arrow2 { stroke: #4a5568; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 8 6; }
    .note { font: 500 14px PingFang SC, Microsoft YaHei, Arial, sans-serif; fill: #1f3a5f; }
</style>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#4a5568" />
    </marker>
</defs>

<rect x="40" y="30" width="1440" height="790" fill="#f8fafc" rx="28" ry="28" />
<text class="title" x="60" y="75">系统架构图</text>
<rect class="zone-dmz" x="260" y="120" width="520" height="600" />
<text class="subtitle" x="290" y="160">DMZ区</text>
<rect class="zone-app" x="840" y="120" width="560" height="600" />
<text class="subtitle" x="870" y="160">App区</text>
<rect class="box" x="70" y="340" width="130" height="90" rx="16" ry="16" />
<text class="label" x="135.0" y="370" text-anchor="middle">用户浏览器</text>
<rect class="box" x="330" y="250" width="220" height="150" rx="16" ry="16" />
<text class="label" x="440.0" y="280" text-anchor="middle">DMZ nginx</text>
<text class="small" x="440.0" y="306" text-anchor="middle">统一访问入口</text>
<text class="small" x="440.0" y="324" text-anchor="middle">按 location 分流</text>
<rect class="box" x="590" y="300" width="150" height="110" rx="16" ry="16" />
<text class="label" x="665.0" y="330" text-anchor="middle">Java Web 接入层</text>
<text class="small" x="665.0" y="356" text-anchor="middle">统一 API</text>
<text class="small" x="665.0" y="374" text-anchor="middle">/agents/ 转发入口</text>
<rect class="box" x="920" y="250" width="180" height="110" rx="16" ry="16" />
<text class="label" x="1010.0" y="280" text-anchor="middle">Python Agent服务</text>
<text class="small" x="1010.0" y="306" text-anchor="middle">fxcjg/server</text>
<rect class="box" x="920" y="470" width="180" height="110" rx="16" ry="16" />
<text class="label" x="1010.0" y="500" text-anchor="middle">Java Service</text>
<text class="small" x="1010.0" y="526" text-anchor="middle">用户/权限/基础业务</text>
<ellipse cx="1245.0" cy="358" rx="65.0" ry="18" fill="#fff5f5" stroke="#d9485f" stroke-width="2" />
<rect x="1180" y="358" width="130" height="144" fill="#fff5f5" stroke="#d9485f" stroke-width="2" />
<ellipse cx="1245.0" cy="502" rx="65.0" ry="18" fill="#fff5f5" stroke="#d9485f" stroke-width="2" />
<text class="label" x="1245.0" y="426.0" text-anchor="middle">共享数据库(DB)</text>
<line class="arrow" x1="200" y1="385" x2="330" y2="325" />
<text class="note" x="265.0" y="347.0" text-anchor="middle">HTTP/HTTPS</text>
<line class="arrow" x1="550" y1="325" x2="590" y2="335" />
<text class="note" x="570.0" y="322.0" text-anchor="middle">API 请求</text>
<line class="arrow" x1="740" y1="345" x2="920" y2="305" />
<text class="note" x="830.0" y="317.0" text-anchor="middle">/agents/* HTTP 转发</text>
<line class="arrow" x1="740" y1="385" x2="920" y2="525" />
<text class="note" x="830.0" y="447.0" text-anchor="middle">Dubbo</text>
<line class="arrow" x1="1100" y1="305" x2="1180" y2="390" />
<text class="note" x="1140.0" y="339.5" text-anchor="middle">读写</text>
<line class="arrow" x1="1100" y1="525" x2="1180" y2="470" />
<text class="note" x="1140.0" y="489.5" text-anchor="middle">读写</text>
<text class="small" x="335" y="430">静态页面资源(psoss-fe)由 DMZ nginx 指定目录直接承载</text>
<text class="small" x="60" y="785">说明：浏览器统一访问 DMZ nginx；nginx 按 location 分流到静态页面资源或 Java Web。Java Web 再分别调用 Python Agent 服务与 Java Service，二者共用一个数据库。</text>
</svg>