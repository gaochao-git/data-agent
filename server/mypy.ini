# mypy 静态类型检查配置（non-strict 基线）
#
# 门禁入口：scripts/verify（--fast/--all 均跑）；解释器用 fxcjg 环境的
# python -m mypy（mypy 2.3.1），与其它步骤共用解释器避免版本漂移。
#
# 演进路线（2026-09-30 类型化改造）：
# - 当前为 non-strict 全量基线：生产代码注解齐全率 96%+ 时已清零（405 文件 0 错误）。
# - 收紧方向：按模块逐步加 strict 开关（[mypy-apps.chat_data_app.services.*] 等
#   per-module 段），tests 与 evaluate 维持宽松（Octop overrides 同款策略）。
# - 注意：必须在 server/ 目录下执行——explicit_package_bases 以 cwd 为包根，
#   解析 `utils.*` 与 `apps.chat_data_app.*` 的双根布局。

[mypy]
python_version = 3.12
files = apps, utils, main.py, scripts
explicit_package_bases = True
# 三方库（langchain/langgraph/aiomysql/pymysql 等）无 stub，缺失导入不阻断；
# 真实类型错误仍会检出
ignore_missing_imports = True
