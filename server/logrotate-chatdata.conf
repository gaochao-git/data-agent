# ChatData 应用日志外部轮转配置（多 worker 生产环境）
#
# 使用前提：
#   1. 应用侧设置 LOG_ROTATION_MODE=external
#      此时应用使用 WatchedFileHandler，只写文件、不自己 rename；
#      各 worker 在文件被替换后的下一次写入会自动重新打开新文件。
#   2. 日志目录固定为 /data/appLogs/dataagent，应用侧需要设置：
#        LOG_DIR=/data/appLogs/dataagent
#      如果部署目录不同，同步修改下面的路径。
#   3. logrotate 需要以 root 运行；如果日志目录/文件属主不是 root，
#      必须保留下面的 su 行并改成实际运行用户/用户组。
#
# 安装：
#   sudo cp <repo>/server/logrotate-chatdata.conf /etc/logrotate.d/chatdata
#   sudo chown root:root /etc/logrotate.d/chatdata
#   sudo chmod 644 /etc/logrotate.d/chatdata
#
# 校验/演练：
#   sudo logrotate -d /etc/logrotate.d/chatdata     # dry-run，只打印计划
#   sudo logrotate -f /etc/logrotate.d/chatdata     # 强制执行一次
#
# 执行后确认：
#   - 旧文件被改名为 *.log.2026-11-01（日期后缀），应用继续写新的 *.log，无报错
#   - 多个 worker 的日志都进入同一个新文件
#   - 下一轮 *.log.2026-11-01 才会被压缩为 *.gz，避免 worker 仍持有旧 fd 时压缩损坏

/data/appLogs/dataagent/*.log {
    # 按天切割
    daily

    # 保留 180 份（约 180 天）；压缩后仍按份数计算
    rotate 180

    # 轮转后的文件名带日期：xxx.log.2026-11-01（与内置轮转模式同名口径）
    # 延迟一轮压缩后为 xxx.log.2026-11-01.gz
    dateext
    dateformat .%Y-%m-%d

    # 日志文件不存在时不报错（服务还没启动时也能执行）
    missingok

    # 空文件不轮转
    notifempty

    # 延迟一轮压缩：上一轮的 .1 文件先保留为明文，给所有 worker
    # 留出重新打开文件的时间，避免压缩过程中被追加内容而损坏
    delaycompress
    compress

    # 轮转后创建新文件；属主/属组按实际运行用户修改
    create 0640 <APP_USER> <APP_GROUP>

    # 日志目录或文件属主不是 root 时必须配置；改成实际用户/用户组
    # 若日志目录就是 root 所有，可删除下面这行
    su <APP_USER> <APP_GROUP>

    # 可选：轮转后通知应用重新打开文件（当前 WatchedFileHandler 不需要；
    # 若后续改成普通 FileHandler，可解开并让应用处理 USR1）
    # sharedscripts
    # postrotate
    #     kill -USR1 $(cat /path/to/data-agent.pid 2>/dev/null) 2>/dev/null || true
    # endscript
}
