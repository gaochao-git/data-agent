# ChatData 应用日志外部轮转配置（多 worker 生产环境）
#
# 使用前提：
#   1. 应用侧设置 LOG_ROTATION_MODE=external应用只写文件、不自己 rename；
#   2. 应用侧需要设置日志目录固定为 /data/appLogs/dataagent，：
#   3. logrotate以root运行；如果日志目录/文件属主不是root必须保留下面的su行并改成实际运行用户/组。
#
# 安装：
#   sudo cp /tools/apps/dataagent/server/logrotate-chatdata.conf /etc/logrotate.d/chatdata
#   sudo chown root:root /etc/logrotate.d/chatdata
#   sudo chmod 644 /etc/logrotate.d/chatdata
#
# 校验/演练：
#   sudo logrotate -d /etc/logrotate.d/chatdata     # dry-run，只打印计划
#   sudo logrotate -f /etc/logrotate.d/chatdata     # 强制执行一次
#
# 执行后确认：
#   - 旧文件被改名为 *.log.2026-11-01（日期后缀），应用继续写新的 *.log，无报错
#   - 多个 worker 的日志都进入同一个新文件
#   - 下一轮 *.log.2026-11-01 才会被压缩为 *.gz，避免 worker 仍持有旧 fd 时压缩损坏

/data/appLogs/dataagent/*.log {
    # 按天轮转
    daily

    # 保留 180 天
    rotate 180

    # 使用日期后缀
    dateext

    # 后缀格式：.2026-11-01
    dateformat .%Y-%m-%d

    # 日志不存在时不报错
    missingok

    # 空文件不轮转
    notifempty

    # 延迟一轮再压缩，避免 worker 仍持有旧文件
    delaycompress

    # 压缩历史日志
    compress

    # 新文件权限与属主
    create 0640 <APP_USER> <APP_GROUP>

    # logrotate 执行身份（日志目录非 root 属主时需要）
    su <APP_USER> <APP_GROUP>
}
